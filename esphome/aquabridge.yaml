# =====================================================================
#  AquaBridge — wireless M-Bus water meter -> ESP32 + CC1101 -> Home Assistant
#  https://github.com/Secoolioo/AquaBridge
#
#  Tested with:
#    - Diehl Hydrus 2.0 (Type 173), wM-Bus T1, 868.95 MHz, AES mode 7
#    - diymore ESP32 NodeMCU (ESP32-WROOM-32, USB-C, CH340)
#    - CC1101 868 MHz module
#    - ESPHome 2026.10.1, Home Assistant 2026.10
#
#  Before you flash:
#    1. Copy secrets.example.yaml to secrets.yaml and fill it in.
#    2. Change meter_id below to YOUR meter (hex notation, see docs/04-flashing.md).
#    3. Change "type:" if you do not own a Diehl Hydrus.
# =====================================================================

substitutions:
  device_name: aquabridge
  friendly_name: Water Meter
  meter_id: "0x12345678"   # <-- your meter ID, MUST start with 0x
  meter_driver: hydrus     # wmbusmeters driver name, e.g. hydrus, izar, multical21, apator162

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: wM-Bus water meter receiver (CC1101)
  min_version: 2026.10.0

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      # Decrypting and parsing a telegram runs in the main loop task.
      # The default 8 KB stack is too small for that.
      loop_task_stack_size: 32768

external_components:
  # Pinned to a known good commit. Do not use @main blindly, it moves fast.
  # Always list the components explicitly: the repository also ships an
  # outdated esp32 component that breaks ESPHome >= 2026.3 if it gets loaded.
  - source: github://SzczepanLeon/esphome-components@56abb0055e24bb247c5d3a2a45c9140226e01ac0
    components: [wmbus_radio, wmbus_common, wmbus_meter]
    refresh: never

logger:
  level: INFO           # see esphome/debug-snippets.yaml for the commissioning setup
  logs:
    CC1101: ERROR       # silences "RX timeout" / "RX FIFO overflow" caused by radio noise
    wmbus: ERROR        # silences "Telegram not handled" from your neighbours' meters

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption: {}      # re-uses the API key (ESPHome >= 2026.9)

safe_mode:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:                   # fallback hotspot if the WiFi is gone
    ssid: "AquaBridge-Fallback"
    password: !secret ap_password

captive_portal:

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin

# --------------------------------------------------------------------
#  Radio: CC1101 on the ESP32 hardware SPI (HSPI) pins
# --------------------------------------------------------------------
spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin:
    number: GPIO12
    ignore_strapping_warning: true   # CC1101 SO is high-Z/low while booting

wmbus_radio:
  radio_type: CC1101
  cs_pin:
    number: GPIO2
    ignore_strapping_warning: true
  irq_pin:
    number: GPIO5                    # CC1101 GDO0. GDO2 is not needed.
    ignore_strapping_warning: true

globals:
  - id: last_telegram_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

wmbus_meter:
  - id: water_meter
    meter_id: ${meter_id}
    type: ${meter_driver}
    key: !secret wmbus_key
    mode: [T1, C1]
    on_telegram:
      - then:
          - lambda: 'id(last_telegram_ms) = millis();'
          - if:
              condition:
                time.has_time:
              then:
                - text_sensor.template.publish:
                    id: last_telegram
                    state: !lambda 'return id(sntp_time).utcnow().strftime("%Y-%m-%dT%H:%M:%SZ");'

# --------------------------------------------------------------------
#  Meter values. "field:" is the wmbusmeters field name WITH unit suffix.
#  Not every meter sends every field. Check your first decoded telegram.
# --------------------------------------------------------------------
sensor:
  - platform: wmbus_meter
    parent_id: water_meter
    id: meter_total
    field: total_m3
    name: "Total"
    unit_of_measurement: "m³"
    device_class: water
    state_class: total_increasing
    accuracy_decimals: 3
    icon: mdi:water
    filters:
      # never publish 0, NaN or a lower reading -> protects the HA statistics
      - lambda: |-
          static float last = NAN;
          if (std::isnan(x) || x <= 0.0f) return {};
          if (!std::isnan(last) && x < last) return {};
          last = x;
          return x;

  - platform: wmbus_meter
    parent_id: water_meter
    id: meter_total_at_date
    field: total_at_date_m3
    name: "Total at billing date"
    unit_of_measurement: "m³"
    device_class: water
    accuracy_decimals: 3
    icon: mdi:calendar-check
    filters:
      # placeholder value (188888.887) until the meter has a billing date
      - lambda: |-
          if (std::isnan(x) || x <= 0.0f || x > 100000.0f) return {};
          return x;

  - platform: template
    name: "Usage since billing date"
    unit_of_measurement: "m³"
    device_class: water
    state_class: total_increasing
    accuracy_decimals: 3
    icon: mdi:water-plus
    update_interval: 60s
    lambda: |-
      if (std::isnan(id(meter_total).state) || std::isnan(id(meter_total_at_date).state)) return {};
      const float v = id(meter_total).state - id(meter_total_at_date).state;
      if (v < 0.0f) return {};
      return v;

  - platform: wmbus_meter
    parent_id: water_meter
    field: flow_temperature_c
    name: "Water temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: wmbus_meter
    parent_id: water_meter
    field: remaining_battery_life_y
    name: "Battery life"
    unit_of_measurement: "a"
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    icon: mdi:battery-clock

  - platform: wmbus_meter
    parent_id: water_meter
    field: rssi_dbm
    name: "Meter signal"
    unit_of_measurement: "dBm"
    device_class: signal_strength
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"

text_sensor:
  - platform: wmbus_meter
    parent_id: water_meter
    field: status
    name: "Meter status"     # Diehl reports vendor bits like UNKNOWN_80 in normal operation
    entity_category: diagnostic
    icon: mdi:information-outline

  - platform: template
    id: last_telegram
    name: "Last telegram"
    device_class: timestamp
    entity_category: diagnostic
    update_interval: never

  - platform: wifi_info
    ip_address:
      name: "IP address"
    ssid:
      name: "WiFi network"

  - platform: version
    name: "Firmware"
    hide_timestamp: true

binary_sensor:
  - platform: status
    name: "Status"

  - platform: template
    name: "Meter reception"
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      // off after 10 minutes without a telegram (a Hydrus sends every ~20 s)
      const uint32_t timeout_ms = 10UL * 60UL * 1000UL;
      if (id(last_telegram_ms) == 0) {
        if (millis() < timeout_ms) return {};   // just booted: unknown, no false alarm
        return false;
      }
      return (millis() - id(last_telegram_ms)) < timeout_ms;

button:
  - platform: restart
    name: "Restart"
  - platform: safe_mode
    name: "Restart (safe mode)"
