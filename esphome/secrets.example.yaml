# Copy this file to "secrets.yaml" (same folder) and fill in your values.
# secrets.yaml is listed in .gitignore - never commit it.

wifi_ssid: "YourWiFi"
wifi_password: "YourWiFiPassword"

# AES-128 key of YOUR water meter, 32 hex characters.
# You get it from your water utility / metering service (see docs/03-aes-key.md).
wmbus_key: "00112233445566778899AABBCCDDEEFF"

# Encryption key for the Home Assistant API (OTA re-uses it).
# Generate one with:  openssl rand -base64 32
api_encryption_key: "REPLACE_WITH_32_RANDOM_BYTES_BASE64="

# Password of the fallback hotspot "AquaBridge-Fallback" (8-64 characters)
ap_password: "choose-a-password"
