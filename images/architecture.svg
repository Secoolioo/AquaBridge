<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b7a90"/>
    </marker>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" rx="20" fill="#0a1a26"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#eef5fa">How the data flows</text>
  <text x="40" y="80" font-size="15" fill="#7f95a7">Everything stays inside your house. The meter only broadcasts, nothing is ever sent back to it.</text>

  <!-- boxes -->
  <g font-size="15">
    <!-- meter -->
    <rect x="40" y="130" width="230" height="220" rx="14" fill="#0f2635" stroke="#2c4b60"/>
    <text x="155" y="166" text-anchor="middle" font-size="18" font-weight="700" fill="#eef5fa">Water meter</text>
    <text x="155" y="190" text-anchor="middle" fill="#7dd3fc">Diehl Hydrus 2.0</text>
    <text x="60" y="226" fill="#a9bccb">• broadcasts every ~20 s</text>
    <text x="60" y="252" fill="#a9bccb">• wM-Bus T1, 868.95 MHz</text>
    <text x="60" y="278" fill="#a9bccb">• AES-128 encrypted</text>
    <text x="60" y="304" fill="#a9bccb">• battery, 10+ years</text>
    <text x="60" y="330" fill="#a9bccb">• nothing to install</text>

    <!-- receiver -->
    <rect x="350" y="130" width="250" height="220" rx="14" fill="#10302a" stroke="#2f7a5a"/>
    <text x="475" y="166" text-anchor="middle" font-size="18" font-weight="700" fill="#eef5fa">AquaBridge</text>
    <text x="475" y="190" text-anchor="middle" fill="#6ee7b7">ESP32 + CC1101</text>
    <text x="370" y="226" fill="#a9bccb">• CC1101 catches the frame</text>
    <text x="370" y="252" fill="#a9bccb">• 3-of-6 decode + CRC</text>
    <text x="370" y="278" fill="#a9bccb">• AES decrypt with your key</text>
    <text x="370" y="304" fill="#a9bccb">• wmbusmeters driver parses</text>
    <text x="370" y="330" fill="#a9bccb">• ESPHome sensors</text>

    <!-- HA -->
    <rect x="680" y="130" width="230" height="220" rx="14" fill="#0d2a3d" stroke="#18bcf2" stroke-opacity="0.6"/>
    <text x="795" y="166" text-anchor="middle" font-size="18" font-weight="700" fill="#eef5fa">Home Assistant</text>
    <text x="795" y="190" text-anchor="middle" fill="#7dd3fc">ESPHome integration</text>
    <text x="700" y="226" fill="#a9bccb">• encrypted native API</text>
    <text x="700" y="252" fill="#a9bccb">• long-term statistics</text>
    <text x="700" y="278" fill="#a9bccb">• energy dashboard</text>
    <text x="700" y="304" fill="#a9bccb">• day / month / year</text>
    <text x="700" y="330" fill="#a9bccb">• flow from derivative</text>

    <!-- outputs -->
    <rect x="990" y="130" width="170" height="100" rx="14" fill="#2a1d10" stroke="#a96b1f"/>
    <text x="1075" y="166" text-anchor="middle" font-size="17" font-weight="700" fill="#eef5fa">Push alarm</text>
    <text x="1075" y="192" text-anchor="middle" fill="#fbbf24">leak · burst · frost</text>
    <text x="1075" y="214" text-anchor="middle" fill="#a9bccb">to your phone</text>

    <rect x="990" y="250" width="170" height="100" rx="14" fill="#1b1730" stroke="#6d5bd0"/>
    <text x="1075" y="286" text-anchor="middle" font-size="17" font-weight="700" fill="#eef5fa">Dashboard</text>
    <text x="1075" y="312" text-anchor="middle" fill="#c4b5fd">charts &amp; statistics</text>
    <text x="1075" y="334" text-anchor="middle" fill="#a9bccb">per hour … per year</text>
  </g>

  <!-- links -->
  <g fill="none" stroke="url(#acc)" stroke-width="3" stroke-linecap="round">
    <path d="M282 212a18 18 0 0 1 0 26"/><path d="M294 202a32 32 0 0 1 0 46"/><path d="M306 192a46 46 0 0 1 0 66"/>
  </g>
  <text x="310" y="292" font-size="12" text-anchor="middle" fill="#6f8496">radio</text>
  <path d="M600 240 H672" stroke="#5b7a90" stroke-width="3" marker-end="url(#arr)"/>
  <text x="636" y="230" font-size="12" text-anchor="middle" fill="#6f8496">WiFi</text>
  <path d="M910 200 H982" stroke="#5b7a90" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M910 290 H982" stroke="#5b7a90" stroke-width="3" marker-end="url(#arr)"/>

  <!-- footer strip -->
  <rect x="40" y="390" width="1120" height="94" rx="14" fill="#0f2230" stroke="#21394b"/>
  <g font-size="14" fill="#a9bccb">
    <text x="64" y="424"><tspan fill="#7dd3fc" font-weight="700">Frame</tspan>  44 A511 &lt;ID&gt; 76 07 | 8C … (ELL) | 90 0F … (AFL, MAC) | 7A … (TPL, AES-CBC) | 0C13 total | 0A5A temp | 02FD74 battery</text>
    <text x="64" y="456"><tspan fill="#6ee7b7" font-weight="700">Result</tspan>  {"total_m3":146.741, "total_at_date_m3":26.541, "flow_temperature_c":14.2, "remaining_battery_life_y":10.9, "rssi_dbm":-37}</text>
  </g>
</svg>
